<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Travel eSIM Opportunity · MVNE</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B4F8A;--navy-ink:#0A3C6B;--teal:#00D9C0;--ink:#0B1220;--mut:#56616F;--line:#E2E7ED}
*{box-sizing:border-box;margin:0;padding:0} html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px 16px;
 background:linear-gradient(118deg,#04101F 0%,#081527 55%,#0B2440 100%);position:relative;overflow:hidden}
body::after{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(60% 50% at 80% 20%,rgba(0,217,192,.14),transparent 70%)}
.box{position:relative;z-index:1;width:100%;max-width:420px;background:#fff;border-radius:20px;
 padding:34px 30px 26px;box-shadow:0 40px 90px -24px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.08);
 animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.box{animation:none}}
.logo{height:34px;width:auto;display:block}
.bar{width:52px;height:4px;border-radius:2px;background:var(--teal);margin:24px 0 18px}
.kick{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--navy)}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:8px 0}
.sub{color:var(--mut);font-size:13.5px;line-height:1.55;margin-bottom:22px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8893A1;margin-bottom:7px}
input{width:100%;padding:13px 15px;border-radius:11px;border:1px solid var(--line);background:#F6F8FA;font-size:15px;outline:none;letter-spacing:1px;font-family:inherit}
input:focus{border-color:var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(11,79,138,.14)}
button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:11px;cursor:pointer;background:linear-gradient(135deg,var(--navy),var(--navy-ink));
 color:#fff;font-weight:700;font-size:15px;font-family:inherit}
button:hover{opacity:.92}
.err{color:#B3223A;font-size:12.5px;margin-top:10px;font-weight:600;display:none}
.foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:#7A8592;line-height:1.5}
</style></head><body>
<form class="box" action="/unlock" method="post">
 <div class="bar"></div>
 <div class="kick">Confidential</div>
 <h1>Travel eSIM Opportunity · MVNE</h1>
 <p class="sub">Enter the access code you were given to open this site.</p>
 <label for="pin">Access code</label>
 <input id="pin" name="pin" type="password" autocomplete="off" autofocus required>
 <button type="submit">Open</button>
 <p class="err" id="e">That code was not recognised. Please try again.</p>
 <p class="foot">Prepared by DSG / MVNE. For the code, contact your MVNE contact.</p>
</form>
<script>if(location.search.indexOf('e=1')>-1)document.getElementById('e').style.display='block';</script>
</body></html>
